[package]
name = "l10n_swc_plugin"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
l10n_macro.workspace = true
serde.workspace = true
serde_json.workspace = true
swc_core = { workspace = true, features = ["ecma_plugin_transform"] }

[dev-dependencies]
swc_core = { workspace = true, features = ["ecma_plugin_transform", "testing_transform", "ecma_parser"] }
testing = "27"
