[workspace]
resolver = "2"
members = ["crates/*", "packages/swc-plugin"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
l10n_macro = { path = "crates/l10n-macro" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
swc_core = "82"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

# the swc plugin is distributed as a wasm file, so it is optimized for size
[profile.wasm]
inherits = "release"
opt-level = "s"
