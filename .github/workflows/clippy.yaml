name: Clippy

on:
  push:
  pull_request:

permissions: read-all

jobs:
  clippy:
    name: Run clippy scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Rust
        run: |
          rustup toolchain install
          cargo install --locked clippy-sarif@0.8.0

      - name: Run Clippy
        run: |
          cargo clippy --manifest-path packages/swc-plugin/Cargo.toml --all-targets
          mkdir -p build
          cargo clippy --manifest-path packages/swc-plugin/Cargo.toml --all-targets --message-format=json \
            | clippy-sarif \
            | jq '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= "packages/swc-plugin/" + .' \
            > build/clippy-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # tag=v4.39.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: build/clippy-results.sarif
          category: clippy
          wait-for-processing: true

      - name: Check formatting
        run: cargo fmt --manifest-path packages/swc-plugin/Cargo.toml --check
