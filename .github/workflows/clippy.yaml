name: Clippy

on:
  push:
  pull_request:

permissions: read-all

jobs:
  clippy:
    name: Run clippy scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Rust
        run: |
          rustup toolchain install
          cargo install --locked clippy-sarif@0.8.0

      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets
          mkdir -p build
          cargo clippy --workspace --all-targets --message-format=json | clippy-sarif > build/clippy-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # tag=v4.39.3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: build/clippy-results.sarif
          category: clippy
          wait-for-processing: true

      - name: Check formatting
        run: cargo fmt --all --check
